<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNC Feeds &amp; Speeds — Stoyanov Guitars</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2c2018" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Feeds &amp; Speeds" />
  <link rel="apple-touch-icon" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:           #f5f0e8;
      --bg-card:      #ffffff;
      --bg-inset:     #ede8df;
      --border:       #ddd5c4;
      --border-hi:    #c0ae92;
      --text:         #2c2018;
      --text-2:       #6b5c4a;
      --text-3:       #9e8e7c;
      --accent:       #b5881e;
      --accent-faint: rgba(181,136,30,0.1);
      --green:        #1f7a40;
      --yellow:       #b85e00;
      --red:          #bf2020;
    }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 18px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(44,32,24,0.06);
    }
    .lbl {
      font-size: 13px;
      letter-spacing: 1.5px;
      color: var(--text-3);
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .mbtn {
      padding: 7px 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-2);
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .mbtn:hover { border-color: var(--accent); color: var(--accent); }
    .mbtn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-faint); font-weight: 600; }
    .tab {
      padding: 10px 18px;
      border: none;
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text-2); }
    .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
    .formula {
      background: var(--bg-inset);
      border-left: 3px solid var(--border-hi);
      padding: 10px 14px;
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-2);
      border-radius: 0 6px 6px 0;
      margin: 6px 0;
      font-family: 'JetBrains Mono', monospace;
    }
    .formula .hi  { color: var(--accent); font-weight: 600; }
    .formula .val { color: var(--text);   font-weight: 600; }
    .rule {
      background: var(--bg-inset);
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 0 6px 6px 0;
      font-size: 16px;
      line-height: 1.7;
      color: var(--text);
    }
    .rule .sub { color: var(--text-2); font-size: 14px; margin-top: 3px; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    /* Unit toggle pill */
    .unit-toggle {
      display: flex;
      background: var(--bg-inset);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
    }
    .unit-toggle button {
      padding: 5px 16px;
      border: none;
      border-radius: 16px;
      background: transparent;
      color: var(--text-3);
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 1px;
    }
    .unit-toggle button.on { background: var(--accent); color: #fff; }
    /* Responsive layout */
    .main-grid {
      padding: 20px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      max-width: 1440px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
    }
    .svg-scroll { overflow-x: auto; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-inset); }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TOOLS = [
      { dia: 0.4,   label: "0.4",          iLabel: '0.016"', group: "micro" },
      { dia: 0.5,   label: "0.5",          iLabel: '0.020"', group: "micro" },
      { dia: 0.6,   label: "0.6",          iLabel: '0.024"', group: "micro" },
      { dia: 0.8,   label: "0.8",          iLabel: '0.031"', group: "micro" },
      { dia: 1.0,   label: "1.0",          iLabel: '0.039"', group: "micro" },
      { dia: 2.0,   label: "2",            iLabel: '0.079"', group: "small" },
      { dia: 3.0,   label: "3",            iLabel: '0.118"', group: "small" },
      { dia: 3.175, label: '3.175 (1/8")', iLabel: '1/8"',   group: "small" },
      { dia: 4.0,   label: "4",            iLabel: '0.157"', group: "small" },
      { dia: 5.0,   label: "5",            iLabel: '0.197"', group: "standard" },
      { dia: 6.0,   label: "6",            iLabel: '0.236"', group: "standard" },
      { dia: 6.35,  label: '6.35 (1/4")',  iLabel: '1/4"',   group: "standard" },
      { dia: 8.0,   label: "8",            iLabel: '0.315"', group: "standard" },
      { dia: 10.0,  label: "10",           iLabel: '0.394"', group: "large" },
      { dia: 12.0,  label: "12",           iLabel: '0.472"', group: "large" },
      { dia: 12.7,  label: '12.7 (1/2")',  iLabel: '1/2"',   group: "large" },
    ];

    const buildChiploads = (scale) => TOOLS.map(t => {
      const d = t.dia;
      let min, max;
      if      (d <= 0.4)  { min = 0.002; max = 0.004; }
      else if (d <= 0.5)  { min = 0.002; max = 0.005; }
      else if (d <= 0.6)  { min = 0.003; max = 0.006; }
      else if (d <= 0.8)  { min = 0.004; max = 0.008; }
      else if (d <= 1.0)  { min = 0.006; max = 0.012; }
      else if (d <= 2.0)  { min = 0.020; max = 0.040; }
      else if (d <= 3.0)  { min = 0.050; max = 0.080; }
      else if (d <= 3.2)  { min = 0.065; max = 0.110; }
      else if (d <= 4.0)  { min = 0.090; max = 0.140; }
      else if (d <= 5.0)  { min = 0.130; max = 0.180; }
      else if (d <= 6.0)  { min = 0.180; max = 0.240; }
      else if (d <= 6.4)  { min = 0.200; max = 0.260; }
      else if (d <= 8.0)  { min = 0.280; max = 0.360; }
      else if (d <= 10.0) { min = 0.360; max = 0.440; }
      else if (d <= 12.0) { min = 0.420; max = 0.510; }
      else                { min = 0.460; max = 0.540; }
      return [+(min * scale).toFixed(4), +(max * scale).toFixed(4)];
    });

    const materials = [
      { name: "Hardwood",     color: "#8B5E3C", chipload: buildChiploads(1.00) },
      { name: "Plywood",      color: "#C4943A", chipload: buildChiploads(1.15) },
      { name: "MDF",          color: "#9A8070", chipload: buildChiploads(1.30) },
      { name: "Soft Plastic", color: "#4A90D9", chipload: buildChiploads(0.90) },
      { name: "Hard Plastic", color: "#2C5F8A", chipload: buildChiploads(0.65) },
    ];

    const GROUP_COLORS = { micro: "#ef4444", small: "#d4872a", standard: "#1f9e52", large: "#4a90d9" };
    const GROUP_LABELS = { micro: "MICRO", small: "SMALL", standard: "STANDARD", large: "LARGE" };
    const vAngles = [60, 90];

    /* ── Unit helpers ── */
    const mm2in    = v => v / 25.4;
    const fmtFeed  = (mm, imp) => imp ? mm2in(mm).toFixed(1) + ' in/min' : mm + ' mm/min';
    const fmtChip  = (mm, imp) => imp ? mm2in(mm).toFixed(5) + '"' : mm.toFixed(4) + ' mm';
    const fmtLen   = (mm, imp) => imp ? mm2in(mm).toFixed(3) + '"' : mm.toFixed(2) + ' mm';
    const fmtDia   = (t,  imp) => imp ? t.iLabel : t.label;

    /* ── V-BIT DIAGRAM ── */
    function VBitDiagram({ angleDeg, channelMM, imperial }) {
      const W = 320, H = 200, cx = W / 2, woodTop = 60;
      const halfAngle = (angleDeg / 2) * Math.PI / 180;
      const depth  = (channelMM / 2) / Math.tan(halfAngle);
      const depthPx = Math.min(depth * 8, H - woodTop - 10);
      const widthPx = channelMM * 8;
      const tipY  = woodTop + depthPx;
      const leftX = cx - widthPx / 2;
      const rightX = cx + widthPx / 2;
      const bitHalfW = 12, bitH = 40;
      const wLabel = imperial ? mm2in(channelMM).toFixed(3) + '"' : channelMM.toFixed(1) + ' mm';
      const dLabel = imperial ? mm2in(depth).toFixed(3) + '"'     : depth.toFixed(1) + ' mm';
      return (
        <svg width={W} height={H} style={{ display:"block", margin:"0 auto" }}>
          <defs>
            <linearGradient id="vwg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stopColor="#8B5E3C" />
              <stop offset="100%" stopColor="#5C3A1E" />
            </linearGradient>
            <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stopColor="#aaa" />
              <stop offset="40%"  stopColor="#eee" />
              <stop offset="100%" stopColor="#888" />
            </linearGradient>
            <linearGradient id="vcg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stopColor="#1a0f08" />
              <stop offset="100%" stopColor="#3d1f0a" />
            </linearGradient>
          </defs>
          <rect x={20} y={woodTop} width={W-40} height={H-woodTop-10} fill="url(#vwg)" rx="2" />
          {[10,25,45,65,90].map(dy => (
            <line key={dy} x1={20} y1={woodTop+dy} x2={W-20} y2={woodTop+dy+3} stroke="#6B4423" strokeWidth="0.5" opacity="0.4" />
          ))}
          <polygon points={`${leftX},${woodTop} ${cx},${tipY} ${rightX},${woodTop}`} fill="url(#vcg)" />
          <line x1={leftX}  y1={woodTop-10} x2={rightX} y2={woodTop-10} stroke="#b5881e" strokeWidth={1} />
          <line x1={leftX}  y1={woodTop-14} x2={leftX}  y2={woodTop-6}  stroke="#b5881e" strokeWidth={1} />
          <line x1={rightX} y1={woodTop-14} x2={rightX} y2={woodTop-6}  stroke="#b5881e" strokeWidth={1} />
          <text x={cx} y={woodTop-15} textAnchor="middle" fill="#b5881e" fontSize="13" fontFamily="'JetBrains Mono',monospace">⟵ {wLabel} ⟶</text>
          <line x1={rightX+16} y1={woodTop} x2={rightX+16} y2={tipY}    stroke="#4a90d9" strokeWidth={1} />
          <line x1={rightX+10} y1={woodTop} x2={rightX+22} y2={woodTop} stroke="#4a90d9" strokeWidth={1} />
          <line x1={rightX+10} y1={tipY}    x2={rightX+22} y2={tipY}    stroke="#4a90d9" strokeWidth={1} />
          <text x={rightX+26} y={woodTop+depthPx/2+4} fill="#4a90d9" fontSize="13" fontFamily="'JetBrains Mono',monospace">{dLabel}</text>
          <rect x={cx-bitHalfW} y={woodTop-bitH} width={bitHalfW*2} height={bitH} fill="url(#vbg)" rx="1" />
          {[-6,-14,-22,-30].map(dy => (
            <line key={dy} x1={cx-bitHalfW} y1={woodTop+dy} x2={cx+bitHalfW} y2={woodTop+dy-3} stroke="#999" strokeWidth="0.5" />
          ))}
          <polygon points={`${cx-bitHalfW},${woodTop} ${cx},${tipY} ${cx+bitHalfW},${woodTop}`} fill="url(#vbg)" />
          <text x={cx-38} y={woodTop+18} fill="#ccc" fontSize="12" fontFamily="'JetBrains Mono',monospace">{angleDeg/2}°</text>
          <line x1={cx} y1={woodTop} x2={leftX} y2={woodTop} stroke="#888" strokeWidth="0.8" strokeDasharray="3,2" />
          <text x={cx} y={H-4} textAnchor="middle" fill="#888" fontSize="12" fontFamily="'JetBrains Mono',monospace">V-BIT {angleDeg}° — CROSS SECTION</text>
        </svg>
      );
    }

    /* ── CHIPLOAD DIAGRAM ── */
    function ChiploadDiagram({ chiploadMM, diaMM, flutes, imperial }) {
      const [angle, setAngle] = useState(0);
      useEffect(() => {
        let raf;
        const tick = () => { setAngle(a => (a + 1.5) % 360); raf = requestAnimationFrame(tick); };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, []);
      const W = 320, H = 200, cx = W/2, cy = H/2;
      const r = Math.min(diaMM / 2 * 10, 55);
      const chipPx = Math.min(chiploadMM * 10 * 12, r * 0.6);
      const fluteAngles = Array.from({ length: flutes }, (_, i) => angle + i * (360 / flutes));
      const chipLabel = imperial ? mm2in(chiploadMM).toFixed(5) + '"' : chiploadMM.toFixed(3) + ' mm';
      const diaLabel  = imperial ? 'Ø ' + mm2in(diaMM).toFixed(4) + '"' : 'Ø ' + diaMM + ' mm';
      return (
        <svg width={W} height={H} style={{ display:"block", margin:"0 auto" }}>
          <defs>
            <radialGradient id="btg" cx="40%" cy="40%">
              <stop offset="0%"   stopColor="#ddd" />
              <stop offset="60%"  stopColor="#999" />
              <stop offset="100%" stopColor="#555" />
            </radialGradient>
          </defs>
          <rect x={20} y={20} width={W-40} height={H-40} fill="#5C3A1E" rx="4" opacity="0.6" />
          <rect x={20} y={cy-r-2} width={cx-r} height={r*2+4} fill="#1a0f08" opacity="0.8" />
          {fluteAngles.map((fa, i) => {
            const faRad = fa * Math.PI / 180;
            const chipArcStart = faRad - 0.3;
            const chipR = r + chipPx;
            const x1 = cx + r    * Math.cos(chipArcStart), y1 = cy + r    * Math.sin(chipArcStart);
            const x2 = cx + chipR * Math.cos(chipArcStart), y2 = cy + chipR * Math.sin(chipArcStart);
            const x3 = cx + chipR * Math.cos(faRad),        y3 = cy + chipR * Math.sin(faRad);
            const x4 = cx + r    * Math.cos(faRad),        y4 = cy + r    * Math.sin(faRad);
            return <polygon key={i} points={`${x1},${y1} ${x2},${y2} ${x3},${y3} ${x4},${y4}`} fill="#d4a853" opacity="0.75" />;
          })}
          <circle cx={cx} cy={cy} r={r} fill="url(#btg)" />
          {fluteAngles.map((fa, i) => {
            const faRad = fa * Math.PI / 180;
            const ex = cx + r * Math.cos(faRad), ey = cy + r * Math.sin(faRad);
            const ix = cx + r*0.3*Math.cos(faRad+Math.PI*0.6), iy = cy + r*0.3*Math.sin(faRad+Math.PI*0.6);
            return <path key={i} d={`M ${ix},${iy} Q ${cx},${cy} ${ex},${ey}`} stroke="#333" strokeWidth="2.5" fill="none" />;
          })}
          <circle cx={cx} cy={cy} r={3} fill="#222" />
          {(() => {
            const fa0 = fluteAngles[0] * Math.PI / 180;
            const lx = cx + (r + chipPx/2) * Math.cos(fa0 - 0.15);
            const ly = cy + (r + chipPx/2) * Math.sin(fa0 - 0.15);
            return <>
              <line x1={lx} y1={ly} x2={lx+28} y2={ly-20} stroke="#d4a853" strokeWidth="1" />
              <text x={lx+30} y={ly-22} fill="#d4a853" fontSize="12" fontFamily="'JetBrains Mono',monospace">CHIPLOAD</text>
              <text x={lx+30} y={ly-12} fill="#d4a853" fontSize="12" fontFamily="'JetBrains Mono',monospace">{chipLabel}</text>
            </>;
          })()}
          <line x1={cx-r} y1={cy+r+16} x2={cx+r} y2={cy+r+16} stroke="#4a90d9" strokeWidth={1} />
          <line x1={cx-r} y1={cy+r+11} x2={cx-r} y2={cy+r+21} stroke="#4a90d9" strokeWidth={1} />
          <line x1={cx+r} y1={cy+r+11} x2={cx+r} y2={cy+r+21} stroke="#4a90d9" strokeWidth={1} />
          <text x={cx} y={cy+r+28} textAnchor="middle" fill="#4a90d9" fontSize="12" fontFamily="'JetBrains Mono',monospace">{diaLabel}</text>
          <line x1={cx-r-10} y1={cy} x2={cx-r-35} y2={cy} stroke="#ccc" strokeWidth="1.5" />
          <polygon points={`${cx-r-35},${cy-4} ${cx-r-43},${cy} ${cx-r-35},${cy+4}`} fill="#ccc" />
          <text x={cx-r-45} y={cy-6} fill="#ccc" fontSize="13" fontFamily="'JetBrains Mono',monospace" textAnchor="end">feed</text>
          <text x={cx} y={H-4} textAnchor="middle" fill="#888" fontSize="12" fontFamily="'JetBrains Mono',monospace">TOP-DOWN VIEW — {flutes}-FLUTE BIT ROTATING</text>
        </svg>
      );
    }

    /* ── PASS DEPTH DIAGRAM ── */
    function PassDepthDiagram({ passDepthMM, toolDiaMM, plungeMM, imperial }) {
      const W = 320, H = 160, passes = 3;
      const woodH = Math.min(passDepthMM * passes * 6 + 20, H - 40);
      const passH = Math.min(passDepthMM * 6, (woodH - 20) / passes);
      const bitR  = Math.min(toolDiaMM / 2 * 6, 20);
      const plLabel = imperial ? mm2in(plungeMM).toFixed(1) + ' in/min' : plungeMM.toFixed(0) + ' mm/min';
      return (
        <svg width={W} height={H} style={{ display:"block", margin:"0 auto" }}>
          <defs>
            <linearGradient id="pwg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stopColor="#8B5E3C" />
              <stop offset="100%" stopColor="#4a2a0e" />
            </linearGradient>
          </defs>
          <rect x={30} y={20} width={180} height={woodH} fill="url(#pwg)" rx="2" />
          {[0.2,0.4,0.6,0.8].map(f => (
            <line key={f} x1={30} y1={20+woodH*f} x2={210} y2={20+woodH*f+4} stroke="#6B4423" strokeWidth="0.5" opacity="0.3" />
          ))}
          {Array.from({length:passes}).map((_,i) => {
            const y = 20 + i * passH;
            return <g key={i}>
              <rect x={30} y={y} width={180} height={passH} fill={i%2===0 ? "rgba(0,0,0,0.15)" : "rgba(255,255,255,0.05)"} />
              {i > 0 && <line x1={30} y1={y} x2={210} y2={y} stroke="#d4a853" strokeWidth="0.8" strokeDasharray="4,3" opacity="0.7" />}
              <text x={216} y={y+passH/2+4} fill="#d4a853" fontSize="12" fontFamily="'JetBrains Mono',monospace">pass {i+1}</text>
            </g>;
          })}
          <rect x={30+80-bitR} y={20-30} width={bitR*2} height={35} fill="#bbb" rx="1" />
          <rect x={30+80-bitR} y={20} width={bitR*2} height={passH} fill="#999" opacity="0.8" />
          <ellipse cx={30+80} cy={20+passH} rx={bitR} ry={3} fill="#777" />
          <line x1={15} y1={20} x2={15} y2={20+passH} stroke="#1f9e52" strokeWidth={1.5} />
          <line x1={10} y1={20} x2={20} y2={20} stroke="#1f9e52" strokeWidth={1.5} />
          <line x1={10} y1={20+passH} x2={20} y2={20+passH} stroke="#1f9e52" strokeWidth={1.5} />
          <path d={`M ${30+80-bitR-5},${20} Q ${30+80},${20} ${30+80+bitR},${20+passH*0.4}`} fill="none" stroke="#d4872a" strokeWidth="1.5" strokeDasharray="3,2" />
          <text x={240} y={30} fill="#d4872a" fontSize="12" fontFamily="'JetBrains Mono',monospace">← ramp in</text>
          <text x={240} y={42} fill="#d4872a" fontSize="13" fontFamily="'JetBrains Mono',monospace">{plLabel}</text>
          <text x={W/2} y={H-4} textAnchor="middle" fill="#888" fontSize="12" fontFamily="'JetBrains Mono',monospace">SIDE VIEW — PASS DEPTH &amp; RAMPING</text>
        </svg>
      );
    }

    /* ── MAIN APP ── */
    function App() {
      const [feedRate,  setFeedRate]  = useState(2500);
      const [rpm,       setRpm]       = useState(14000);
      const [flutes,    setFlutes]    = useState(2);
      const [matIdx,    setMatIdx]    = useState(0);
      const [toolIdx,   setToolIdx]   = useState(7);
      const [vAngle,    setVAngle]    = useState(60);
      const [channelW,  setChannelW]  = useState(6);
      const [vFlutes,   setVFlutes]   = useState(2);
      const [activeTab, setActiveTab] = useState("chipload");
      const [imperial,  setImperial]  = useState(false);

      const mat      = materials[matIdx];
      const diaMM    = TOOLS[toolIdx].dia;
      const chipload = feedRate / (rpm * flutes);
      const minCL    = mat.chipload[toolIdx][0];
      const maxCL    = mat.chipload[toolIdx][1];
      const inRange  = chipload >= minCL && chipload <= maxCL;
      const tooHigh  = chipload > maxCL;
      const sc       = inRange ? "var(--green)" : tooHigh ? "var(--red)" : "var(--yellow)";
      const msg      = inRange ? "✓ IN RANGE" : tooHigh ? "▲ TOO HIGH — lower feed or raise RPM" : "▼ TOO LOW — raise feed or lower RPM";

      const isMicro      = TOOLS[toolIdx].group === "micro";
      const minPassMM    = isMicro ? diaMM * 0.25 : diaMM;
      const maxPassMM    = isMicro ? diaMM * 0.50 : diaMM * 2;
      const plungeMM     = feedRate / 2;
      const vFeedMM      = vFlutes === 1 ? 1000 : 2000;
      const idealFeedMin = rpm * flutes * minCL;
      const idealFeedMax = rpm * flutes * maxCL;
      const vDepth       = (channelW / 2) / Math.tan((vAngle / 2) * Math.PI / 180);

      // Shorthand display helpers
      const dFeed = mm => fmtFeed(mm, imperial);
      const dChip = mm => fmtChip(mm, imperial);
      const dLen  = mm => fmtLen(mm, imperial);
      const dDia  = t  => fmtDia(t, imperial);
      const dCL   = mm => imperial ? mm2in(mm).toFixed(5) : mm.toFixed(3);
      const unitLabel = imperial ? '"' : ' mm';

      return (
        <div style={{ background:"var(--bg)", minHeight:"100vh" }}>

          {/* ── HEADER ── */}
          <div style={{ background:"#2c2018", padding:"14px 24px", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:"12px" }}>
            <div style={{ display:"flex", alignItems:"center", gap:"16px" }}>
              <img src="logo.svg" alt="Stoyanov Workshop" style={{ height:"92px", width:"auto", filter:"brightness(0) invert(1)", opacity:0.9 }} />
              <div>
                <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:"36px", letterSpacing:"4px", color:"#d4a853", lineHeight:1 }}>
                  CNC FEEDS &amp; SPEEDS
                </div>
                <div style={{ fontSize:"17px", color:"#7a5a3a", letterSpacing:"2px", marginTop:"4px" }}>
                  {imperial ? "IMPERIAL" : "METRIC"} CALCULATOR — STOYANOV GUITARS / ONEFINITY WOODWORKER
                </div>
              </div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:"12px" }}>
              <span style={{ fontSize:"17px", color:"#5a4030", letterSpacing:"2px", fontFamily:"'JetBrains Mono',monospace" }}>UNITS</span>
              <div className="unit-toggle">
                <button className={!imperial ? "on" : ""} onClick={() => setImperial(false)}>MM</button>
                <button className={ imperial ? "on" : ""} onClick={() => setImperial(true)}>INCH</button>
              </div>
            </div>
          </div>

          {/* ── MAIN GRID ── */}
          <div className="main-grid">

            {/* ── LEFT PANEL ── */}
            <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>

              {/* Material */}
              <div className="card">
                <div className="lbl">Material</div>
                <div style={{ display:"flex", flexWrap:"wrap", gap:"6px" }}>
                  {materials.map((m, i) => (
                    <button key={m.name} className={`mbtn ${matIdx===i?"on":""}`} onClick={() => setMatIdx(i)}
                      style={matIdx===i ? {borderColor:m.color, color:m.color, background:`${m.color}18`} : {}}>
                      {m.name}
                    </button>
                  ))}
                </div>
              </div>

              {/* Tool */}
              <div className="card">
                <div className="lbl">Tool Diameter ({imperial ? "in" : "mm"})</div>
                {["micro","small","standard","large"].map(grp => (
                  <div key={grp} style={{ marginBottom:"10px" }}>
                    <div style={{ fontSize:"16px", letterSpacing:"2px", color:GROUP_COLORS[grp], marginBottom:"5px", fontWeight:600 }}>
                      {GROUP_LABELS[grp]}{grp==="micro" ? " — fragile, max RPM, min chipload" : ""}
                    </div>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:"5px" }}>
                      {TOOLS.map((t, i) => t.group !== grp ? null : (
                        <button key={i} className={`mbtn ${toolIdx===i?"on":""}`} onClick={() => setToolIdx(i)}
                          style={toolIdx===i ? {borderColor:GROUP_COLORS[grp], color:GROUP_COLORS[grp], background:`${GROUP_COLORS[grp]}18`} : {}}>
                          {dDia(t)}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
                {isMicro && (
                  <div style={{ marginTop:"6px", background:"#fff0f0", border:"1px solid rgba(239,68,68,0.3)", borderRadius:"6px", padding:"10px", fontSize:"14px", color:"var(--red)", lineHeight:"1.6" }}>
                    ⚠ Micro bit — run at max RPM (30–40k), very low feed, ramp entry only. One wrong move = broken bit.
                  </div>
                )}
              </div>

              {/* Sliders */}
              <div className="card">
                <div style={{ marginBottom:"16px" }}>
                  <div className="lbl">Feed Rate: <span style={{ color:"var(--accent)", fontFamily:"'JetBrains Mono',monospace" }}>{dFeed(feedRate)}</span></div>
                  <input type="range" min={50} max={12700} step={50} value={feedRate} onChange={e => setFeedRate(+e.target.value)} />
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:"17px", color:"var(--text-3)", marginTop:"4px", fontFamily:"'JetBrains Mono',monospace" }}>
                    <span>{imperial ? "2"    : "50"}</span>
                    <span>practical ~{imperial ? "236 in/min" : "6 000 mm/min"}</span>
                    <span>{imperial ? "500"  : "12 700"}</span>
                  </div>
                </div>
                <div style={{ marginBottom:"16px" }}>
                  <div className="lbl">Spindle RPM: <span style={{ color:"var(--accent)", fontFamily:"'JetBrains Mono',monospace" }}>{rpm.toLocaleString()}</span></div>
                  <input type="range" min={1000} max={40000} step={500} value={rpm} onChange={e => setRpm(+e.target.value)} />
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:"17px", color:"var(--text-3)", marginTop:"4px", fontFamily:"'JetBrains Mono',monospace" }}>
                    <span>1 000</span><span>40 000</span>
                  </div>
                </div>
                <div>
                  <div className="lbl">Flutes: <span style={{ color:"var(--accent)", fontFamily:"'JetBrains Mono',monospace" }}>{flutes}</span></div>
                  <input type="range" min={1} max={4} step={1} value={flutes} onChange={e => setFlutes(+e.target.value)} />
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:"17px", color:"var(--text-3)", marginTop:"4px", fontFamily:"'JetBrains Mono',monospace" }}>
                    <span>1</span><span>4</span>
                  </div>
                </div>
              </div>

              {/* Result */}
              <div style={{ background:"var(--bg-card)", border:`2px solid ${sc}`, borderRadius:"10px", padding:"18px", textAlign:"center", boxShadow:"0 1px 4px rgba(44,32,24,0.06)" }}>
                <div className="lbl">Calculated Chipload</div>
                <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:"62px", color:sc, lineHeight:1, letterSpacing:"2px" }}>
                  {imperial ? mm2in(chipload).toFixed(5) + '"' : chipload.toFixed(3) + ' mm'}
                </div>
                <div style={{ fontSize:"14px", color:"var(--text-3)", margin:"6px 0 8px", fontFamily:"'JetBrains Mono',monospace" }}>
                  Target for {mat.name} Ø{imperial ? TOOLS[toolIdx].iLabel : diaMM + "mm"}:{" "}
                  {dCL(minCL)} – {dCL(maxCL)}{unitLabel}
                </div>
                <div style={{ fontSize:"16px", color:sc, letterSpacing:"0.5px", fontWeight:600 }}>{msg}</div>
                <hr className="divider" />
                <div style={{ fontSize:"14px", color:"var(--text-3)", fontFamily:"'JetBrains Mono',monospace" }}>
                  Ideal feed at {rpm.toLocaleString()} RPM:{" "}
                  <span style={{ color:"var(--text)", fontWeight:600 }}>
                    {imperial ? mm2in(idealFeedMin).toFixed(1) : idealFeedMin.toFixed(0)} – {imperial ? mm2in(idealFeedMax).toFixed(1) : idealFeedMax.toFixed(0)} {imperial ? "in/min" : "mm/min"}
                  </span>
                </div>
              </div>

              {/* Rules */}
              <div className="card">
                <div className="lbl" style={{ marginBottom:"10px" }}>Rules of Thumb</div>
                <div className="rule">
                  <strong style={{ color:"var(--accent)" }}>PASS DEPTH</strong> = {isMicro ? "0.25×–0.5× Ø (micro!)" : "1× – 2× Ø"}
                  <div className="sub">
                    Ø{imperial ? TOOLS[toolIdx].iLabel : diaMM + "mm"} →{" "}
                    <strong style={{ color:isMicro ? "var(--red)" : "var(--text)" }}>
                      {dLen(minPassMM)} – {dLen(maxPassMM)} per pass
                    </strong>
                  </div>
                </div>
                <div className="rule">
                  <strong style={{ color:"var(--accent)" }}>PLUNGE RATE</strong> = ½ feed rate
                  <div className="sub">
                    Feed {dFeed(feedRate)} → plunge <strong style={{ color:"var(--text)" }}>{dFeed(plungeMM)}</strong>
                  </div>
                </div>
                <div className="rule">
                  <strong style={{ color:"var(--yellow)" }}>ALWAYS RAMP</strong> — never straight plunge
                  <div className="sub">Use helical or ramp entry in Fusion CAM</div>
                </div>
                <div className="rule">
                  <strong style={{ color:"var(--accent)" }}>V-BIT FEED</strong>&nbsp;
                  <button className={`mbtn ${vFlutes===1?"on":""}`} style={{ fontSize:"17px", padding:"3px 8px" }} onClick={() => setVFlutes(1)}>1 flute</button>&nbsp;
                  <button className={`mbtn ${vFlutes===2?"on":""}`} style={{ fontSize:"17px", padding:"3px 8px" }} onClick={() => setVFlutes(2)}>2 flute</button>
                  <div className="sub">→ <strong style={{ color:"var(--text)" }}>{dFeed(vFeedMM)}</strong></div>
                </div>
              </div>

            </div>{/* end left */}

            {/* ── RIGHT PANEL ── */}
            <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>

              {/* Tabs */}
              <div style={{ background:"var(--bg-card)", borderBottom:"1px solid var(--border)", display:"flex", borderRadius:"10px 10px 0 0", boxShadow:"0 1px 4px rgba(44,32,24,0.06)" }}>
                {[
                  { id:"chipload",  label:"CHIPLOAD EXPLAINED" },
                  { id:"vbit",      label:"V-BIT DEPTH"        },
                  { id:"passdepth", label:"PASS DEPTH"         },
                ].map(t => (
                  <button key={t.id} className={`tab ${activeTab===t.id?"on":""}`} onClick={() => setActiveTab(t.id)}>{t.label}</button>
                ))}
              </div>

              {/* ── Chipload tab ── */}
              {activeTab==="chipload" && (
                <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>
                  <div className="card">
                    <div className="lbl" style={{ marginBottom:"10px" }}>What Is Chipload?</div>
                    <p style={{ fontSize:"17px", color:"var(--text-2)", lineHeight:"1.7", marginBottom:"14px" }}>
                      Chipload is the thickness of material each cutting edge removes per revolution — how big a "bite" each flute takes.
                      Too small → rubbing, heat, bit burns. Too large → chatter, tearout, broken bit.
                    </p>
                    <div className="svg-scroll">
                      <ChiploadDiagram chiploadMM={chipload} diaMM={diaMM} flutes={flutes} imperial={imperial} />
                    </div>
                    <div style={{ marginTop:"10px", background:"var(--bg-inset)", padding:"10px 14px", borderRadius:"6px", fontSize:"16px", color:"var(--text-2)", lineHeight:"1.8", textAlign:"center" }}>
                      The <span style={{ color:"var(--accent)", fontWeight:600 }}>golden wedge</span> ahead of each flute = the chip being cut. That thickness = your chipload.
                    </div>
                  </div>
                  <div className="card">
                    <div className="lbl" style={{ marginBottom:"10px" }}>The Formulas — Live</div>
                    <div className="formula">
                      <span className="hi">CHIPLOAD</span> = Feed ÷ (RPM × Flutes)<br/>
                      = <span className="val">{dFeed(feedRate)}</span> ÷ ({rpm.toLocaleString()} × {flutes}) = <span style={{ color:sc, fontWeight:600 }}>{dChip(chipload)}</span>
                    </div>
                    <div className="formula">
                      <span className="hi">IDEAL FEED</span> at {rpm.toLocaleString()} RPM:<br/>
                      <span className="val">
                        {imperial ? mm2in(idealFeedMin).toFixed(1) : idealFeedMin.toFixed(0)} – {imperial ? mm2in(idealFeedMax).toFixed(1) : idealFeedMax.toFixed(0)} {imperial ? "in/min" : "mm/min"}
                      </span>
                    </div>
                    <div className="formula">
                      <span className="hi">IDEAL RPM</span> at {dFeed(feedRate)}:<br/>
                      <span className="val">
                        {(feedRate/(flutes*maxCL)).toFixed(0)} – {(feedRate/(flutes*minCL)).toFixed(0)} RPM
                      </span>
                    </div>
                  </div>
                </div>
              )}

              {/* ── V-bit tab ── */}
              {activeTab==="vbit" && (
                <div className="card">
                  <div className="lbl" style={{ marginBottom:"10px" }}>V-Bit Geometry</div>
                  <p style={{ fontSize:"17px", color:"var(--text-2)", lineHeight:"1.7", marginBottom:"14px" }}>
                    The V-bit has no fixed depth — <strong style={{ color:"var(--text)" }}>depth is determined by channel width</strong>.
                    A narrow line = shallow cut. A wide area = deep cut. Always set a max depth limit in Fusion.
                  </p>
                  <div style={{ display:"flex", gap:"16px", marginBottom:"14px", flexWrap:"wrap" }}>
                    <div>
                      <div className="lbl">V-Bit Angle</div>
                      <div style={{ display:"flex", gap:"6px" }}>
                        {vAngles.map(a => (
                          <button key={a} className={`mbtn ${vAngle===a?"on":""}`} onClick={() => setVAngle(a)}>{a}°</button>
                        ))}
                      </div>
                    </div>
                    <div style={{ flex:1, minWidth:"180px" }}>
                      <div className="lbl">
                        Channel Width:{" "}
                        <span style={{ color:"var(--accent)", fontFamily:"'JetBrains Mono',monospace" }}>
                          {imperial ? mm2in(channelW).toFixed(3) + '"' : channelW.toFixed(1) + ' mm'}
                        </span>
                      </div>
                      <input type="range" min={1} max={25} step={0.5} value={channelW} onChange={e => setChannelW(+e.target.value)} />
                    </div>
                  </div>
                  <div className="svg-scroll">
                    <VBitDiagram angleDeg={vAngle} channelMM={channelW} imperial={imperial} />
                  </div>
                  <div style={{ marginTop:"12px" }}>
                    <div className="formula">
                      <span className="hi">DEPTH</span> = (Width ÷ 2) ÷ tan(angle/2)<br/>
                      = ({imperial ? mm2in(channelW).toFixed(3) + '"' : channelW.toFixed(1) + ' mm'} ÷ 2) ÷ tan({vAngle/2}°) ={" "}
                      <span className="val">{imperial ? mm2in(vDepth).toFixed(4) + '"' : vDepth.toFixed(2) + ' mm'}</span>
                    </div>
                    <div className="formula" style={{ borderColor:"var(--red)" }}>
                      <span style={{ color:"var(--red)" }}>⚠ FUSION CAM TIP</span><br/>
                      Set <span className="hi">Maximum Depth</span> in Engrave/Contour toolpath.<br/>
                      Select <span className="hi">top edges</span> of sketch — NOT the bottom face.<br/>
                      Use <span className="hi">3D Contour</span> (not Engrave) on curved surfaces.
                    </div>
                  </div>
                </div>
              )}

              {/* ── Pass depth tab ── */}
              {activeTab==="passdepth" && (
                <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>
                  <div className="card">
                    <div className="lbl" style={{ marginBottom:"10px" }}>Pass Depth &amp; Ramping</div>
                    <p style={{ fontSize:"17px", color:"var(--text-2)", lineHeight:"1.7", marginBottom:"14px" }}>
                      Never cut full depth in one pass. Each pass removes 1×–2× tool diameter.{" "}
                      <strong style={{ color:"var(--yellow)" }}>Always ramp into the material</strong> — straight plunge snaps bits.
                    </p>
                    <div className="svg-scroll">
                      <PassDepthDiagram passDepthMM={(minPassMM+maxPassMM)/2} toolDiaMM={diaMM} plungeMM={plungeMM} imperial={imperial} />
                    </div>
                    <div style={{ marginTop:"12px" }}>
                      <div className="formula">
                        <span className="hi">PASS DEPTH</span> for Ø{imperial ? TOOLS[toolIdx].iLabel : diaMM + "mm"} in {mat.name}:<br/>
                        <span className="val">{dLen(minPassMM)}</span> (conservative) — <span className="val">{dLen(maxPassMM)}</span> (aggressive)
                      </div>
                      <div className="formula">
                        <span className="hi">PLUNGE RATE</span> = {dFeed(feedRate)} ÷ 2 = <span className="val">{dFeed(plungeMM)}</span>
                      </div>
                      <div className="formula" style={{ borderColor:"var(--yellow)" }}>
                        <span style={{ color:"var(--yellow)" }}>RAMPING in Fusion 360:</span><br/>
                        CAM → Passes tab → enable <span className="hi">Ramp</span><br/>
                        Set ramp angle to 2°–5° for wood
                      </div>
                    </div>
                  </div>

                  <div className="card">
                    <div className="lbl" style={{ marginBottom:"10px" }}>Chipload Reference — {mat.name} (click to select)</div>
                    <div style={{ overflowY:"auto", maxHeight:"340px" }}>
                      <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"16px", fontFamily:"'JetBrains Mono',monospace" }}>
                        <thead>
                          <tr style={{ borderBottom:"2px solid var(--border)", position:"sticky", top:0, background:"var(--bg-card)" }}>
                            <th style={{ padding:"7px 8px", color:"var(--text-3)", textAlign:"left", fontWeight:600 }}>Ø {imperial?"in":"mm"}</th>
                            <th style={{ padding:"7px 8px", color:"var(--text-3)", fontWeight:600 }}>Group</th>
                            <th style={{ padding:"7px 8px", color:"var(--text-3)", fontWeight:600 }}>Min</th>
                            <th style={{ padding:"7px 8px", color:"var(--text-3)", fontWeight:600 }}>Max</th>
                            <th style={{ padding:"7px 8px", color:"var(--text-3)", fontWeight:600 }}>Pass depth</th>
                          </tr>
                        </thead>
                        <tbody>
                          {TOOLS.map((t, ti) => {
                            const active = toolIdx === ti;
                            const gc     = GROUP_COLORS[t.group];
                            const isMic  = t.group === "micro";
                            const pMin   = isMic ? t.dia * 0.25 : t.dia;
                            const pMax   = isMic ? t.dia * 0.5  : t.dia * 2;
                            const clMin  = mat.chipload[ti][0];
                            const clMax  = mat.chipload[ti][1];
                            return (
                              <tr key={ti} onClick={() => setToolIdx(ti)}
                                style={{ background:active ? `${mat.color}14` : "transparent", borderBottom:"1px solid var(--border)", cursor:"pointer" }}>
                                <td style={{ padding:"6px 8px", color:active ? mat.color : "var(--text-2)", fontWeight:active ? 600 : 400 }}>
                                  {imperial ? t.iLabel : t.dia}
                                </td>
                                <td style={{ padding:"6px 8px" }}>
                                  <span style={{ fontSize:"16px", color:gc, letterSpacing:"1px", fontWeight:600 }}>{t.group.toUpperCase()}</span>
                                </td>
                                <td style={{ padding:"6px 8px", textAlign:"center", color:active ? "var(--text)" : "var(--text-3)" }}>
                                  {imperial ? mm2in(clMin).toFixed(5) : clMin.toFixed(3)}
                                </td>
                                <td style={{ padding:"6px 8px", textAlign:"center", color:active ? "var(--text)" : "var(--text-3)" }}>
                                  {imperial ? mm2in(clMax).toFixed(5) : clMax.toFixed(3)}
                                </td>
                                <td style={{ padding:"6px 8px", textAlign:"center", color:active ? "var(--accent)" : "var(--text-3)" }}>
                                  {imperial
                                    ? mm2in(pMin).toFixed(3) + '"–' + mm2in(pMax).toFixed(3) + '"'
                                    : pMin.toFixed(2) + '–' + pMax.toFixed(2)}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

            </div>{/* end right */}
          </div>{/* end main-grid */}

          <div style={{ textAlign:"center", padding:"16px", fontSize:"17px", color:"var(--text-3)", letterSpacing:"2px", fontFamily:"'JetBrains Mono',monospace" }}>
            STOYANOV GUITARS — CNC REFERENCE TOOL — ONEFINITY WOODWORKER / BUILDBOTICS
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
