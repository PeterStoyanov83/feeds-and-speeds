<!DOCTYPE html> <html lang="en"> <head>   <meta charset="UTF-8" />   <meta name="viewport" content="width=device-width, initial-scale=1.0" />   <title>CNC Feeds &amp; Speeds — Stoyanov Guitars</title>   <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>   <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>   <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>   <link rel="preconnect" href="https://fonts.googleapis.com" />   <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet" />   <style>     * { box-sizing: border-box; margin: 0; padding: 0; }     html, body { background: #0c0c0c; color: #e0d8cc; font-family: 'Share Tech Mono', monospace; }     .card { background: #161616; border: 1px solid #2a2a2a; border-radius: 3px; padding: 14px; }     .lbl { font-size: 9px; letter-spacing: 2px; color: #666; text-transform: uppercase; margin-bottom: 6px; }     input[type=range] { width: 100%; accent-color: #d4a853; cursor: pointer; height: 3px; }     .mbtn { padding: 7px 11px; border: 1px solid #333; background: #111; color: #777;             cursor: pointer; border-radius: 2px; font-size: 10px; font-family: 'Share Tech Mono', monospace;             transition: all 0.15s; white-space: nowrap; }     .mbtn:hover { border-color: #555; color: #aaa; }     .mbtn.on { color: #d4a853; border-color: #d4a853; background: rgba(212,168,83,0.08); }     .tab { padding: 8px 16px; border: none; background: transparent; color: #555;            cursor: pointer; font-family: 'Share Tech Mono', monospace; font-size: 10px;            letter-spacing: 1px; border-bottom: 2px solid transparent; transition: all 0.15s; }     .tab.on { color: #d4a853; border-bottom-color: #d4a853; }     .formula { background: #0f0f0f; border-left: 2px solid #333; padding: 8px 12px;                font-size: 11px; line-height: 1.8; color: #888; border-radius: 0 2px 2px 0; margin: 6px 0; }     .formula .hi { color: #d4a853; }     .formula .val { color: #fff; }     .rule { background: #111; border-left: 2px solid #d4a853; padding: 10px 14px;             margin: 6px 0; border-radius: 0 3px 3px 0; font-size: 11px; line-height: 1.7; }     .rule .sub { color: #666; font-size: 10px; margin-top: 3px; }     .divider { border: none; border-top: 1px solid #222; margin: 12px 0; }     ::-webkit-scrollbar { width: 6px; height: 6px; }     ::-webkit-scrollbar-track { background: #111; }     ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }   </style> </head> <body>   <div id="root"></div>    <script type="text/babel">     const { useState, useEffect, useRef } = React;      const TOOLS = [       { dia: 0.4,   label: "0.4",         group: "micro" },       { dia: 0.5,   label: "0.5",         group: "micro" },       { dia: 0.6,   label: "0.6",         group: "micro" },       { dia: 0.8,   label: "0.8",         group: "micro" },       { dia: 1.0,   label: "1.0",         group: "micro" },       { dia: 2.0,   label: "2",           group: "small" },       { dia: 3.0,   label: "3",           group: "small" },       { dia: 3.175, label: "3.175 (1/8\")", group: "small" },       { dia: 4.0,   label: "4",           group: "small" },       { dia: 5.0,   label: "5",           group: "standard" },       { dia: 6.0,   label: "6",           group: "standard" },       { dia: 6.35,  label: "6.35 (1/4\")", group: "standard" },       { dia: 8.0,   label: "8",           group: "standard" },       { dia: 10.0,  label: "10",          group: "large" },       { dia: 12.0,  label: "12",          group: "large" },       { dia: 12.7,  label: "12.7 (1/2\")", group: "large" },     ];      const buildChiploads = (scale) => TOOLS.map(t => {       const d = t.dia;       let min, max;       if      (d <= 0.4)  { min = 0.002; max = 0.004; }       else if (d <= 0.5)  { min = 0.002; max = 0.005; }       else if (d <= 0.6)  { min = 0.003; max = 0.006; }       else if (d <= 0.8)  { min = 0.004; max = 0.008; }       else if (d <= 1.0)  { min = 0.006; max = 0.012; }       else if (d <= 2.0)  { min = 0.020; max = 0.040; }       else if (d <= 3.0)  { min = 0.050; max = 0.080; }       else if (d <= 3.2)  { min = 0.065; max = 0.110; }       else if (d <= 4.0)  { min = 0.090; max = 0.140; }       else if (d <= 5.0)  { min = 0.130; max = 0.180; }       else if (d <= 6.0)  { min = 0.180; max = 0.240; }       else if (d <= 6.4)  { min = 0.200; max = 0.260; }       else if (d <= 8.0)  { min = 0.280; max = 0.360; }       else if (d <= 10.0) { min = 0.360; max = 0.440; }       else if (d <= 12.0) { min = 0.420; max = 0.510; }       else                { min = 0.460; max = 0.540; }       return [+(min * scale).toFixed(4), +(max * scale).toFixed(4)];     });      const materials = [       { name: "Hardwood",     color: "#8B5E3C", chipload: buildChiploads(1.00) },       { name: "Plywood",      color: "#C4943A", chipload: buildChiploads(1.15) },       { name: "MDF",          color: "#9A8070", chipload: buildChiploads(1.30) },       { name: "Soft Plastic", color: "#4A90D9", chipload: buildChiploads(0.90) },       { name: "Hard Plastic", color: "#2C5F8A", chipload: buildChiploads(0.65) },     ];      const toolDiaMM = TOOLS.map(t => t.dia);     const GROUP_COLORS = { micro: "#ef4444", small: "#f59e0b", standard: "#22c55e", large: "#60a5fa" };     const GROUP_LABELS = { micro: "MICRO", small: "SMALL", standard: "STANDARD", large: "LARGE" };     const vAngles = [60, 90];      /* ── V-BIT DIAGRAM ── */     function VBitDiagram({ angleDeg, channelMM }) {       const W = 320, H = 200, cx = W / 2, woodTop = 60;       const halfAngle = (angleDeg / 2) * Math.PI / 180;       const depth = (channelMM / 2) / Math.tan(halfAngle);       const depthPx = Math.min(depth * 8, H - woodTop - 10);       const widthPx = channelMM * 8;       const tipY = woodTop + depthPx;       const leftX = cx - widthPx / 2;       const rightX = cx + widthPx / 2;       const bitHalfW = 12, bitH = 40;       return (         <svg width={W} height={H} style={{ display: "block", margin: "0 auto" }}>           <defs>             <linearGradient id="vwg" x1="0" y1="0" x2="0" y2="1">               <stop offset="0%" stopColor="#8B5E3C" /><stop offset="100%" stopColor="#5C3A1E" />             </linearGradient>             <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="0">               <stop offset="0%" stopColor="#aaa" /><stop offset="40%" stopColor="#eee" /><stop offset="100%" stopColor="#888" />             </linearGradient>             <linearGradient id="vcg" x1="0" y1="0" x2="0" y2="1">               <stop offset="0%" stopColor="#1a0f08" /><stop offset="100%" stopColor="#3d1f0a" />             </linearGradient>           </defs>           <rect x={20} y={woodTop} width={W-40} height={H-woodTop-10} fill="url(#vwg)" rx="2" />           {[10,25,45,65,90].map(dy => <line key={dy} x1={20} y1={woodTop+dy} x2={W-20} y2={woodTop+dy+3} stroke="#6B4423" strokeWidth="0.5" opacity="0.4" />)}           <polygon points={`${leftX},${woodTop} ${cx},${tipY} ${rightX},${woodTop}`} fill="url(#vcg)" />           <line x1={leftX} y1={woodTop-10} x2={rightX} y2={woodTop-10} stroke="#d4a853" strokeWidth={1} />           <line x1={leftX} y1={woodTop-14} x2={leftX} y2={woodTop-6} stroke="#d4a853" strokeWidth={1} />           <line x1={rightX} y1={woodTop-14} x2={rightX} y2={woodTop-6} stroke="#d4a853" strokeWidth={1} />           <text x={cx} y={woodTop-14} textAnchor="middle" fill="#d4a853" fontSize="10" fontFamily="'Share Tech Mono',monospace">⟵ {channelMM.toFixed(1)} mm ⟶</text>           <line x1={rightX+16} y1={woodTop} x2={rightX+16} y2={tipY} stroke="#60a5fa" strokeWidth={1} />           <line x1={rightX+10} y1={woodTop} x2={rightX+22} y2={woodTop} stroke="#60a5fa" strokeWidth={1} />           <line x1={rightX+10} y1={tipY} x2={rightX+22} y2={tipY} stroke="#60a5fa" strokeWidth={1} />           <text x={rightX+26} y={woodTop+depthPx/2+4} fill="#60a5fa" fontSize="10" fontFamily="'Share Tech Mono',monospace">{depth.toFixed(1)}mm</text>           <rect x={cx-bitHalfW} y={woodTop-bitH} width={bitHalfW*2} height={bitH} fill="url(#vbg)" rx="1" />           {[-6,-14,-22,-30].map(dy => <line key={dy} x1={cx-bitHalfW} y1={woodTop+dy} x2={cx+bitHalfW} y2={woodTop+dy-3} stroke="#999" strokeWidth="0.5" />)}           <polygon points={`${cx-bitHalfW},${woodTop} ${cx},${tipY} ${cx+bitHalfW},${woodTop}`} fill="url(#vbg)" />           <text x={cx-38} y={woodTop+18} fill="#aaa" fontSize="9" fontFamily="'Share Tech Mono',monospace">{angleDeg/2}°</text>           <line x1={cx} y1={woodTop} x2={leftX} y2={woodTop} stroke="#555" strokeWidth="0.8" strokeDasharray="3,2" />           <text x={cx} y={H-4} textAnchor="middle" fill="#555" fontSize="9" fontFamily="'Share Tech Mono',monospace">V-BIT {angleDeg}° — CROSS SECTION</text>         </svg>       );     }      /* ── CHIPLOAD DIAGRAM ── */     function ChiploadDiagram({ chiploadMM, diaMM, flutes }) {       const [angle, setAngle] = useState(0);       useEffect(() => {         let raf;         const tick = () => { setAngle(a => (a + 1.5) % 360); raf = requestAnimationFrame(tick); };         raf = requestAnimationFrame(tick);         return () => cancelAnimationFrame(raf);       }, []);       const W = 320, H = 200, cx = W/2, cy = H/2;       const r = Math.min(diaMM / 2 * 10, 55);       const chipPx = Math.min(chiploadMM * 10 * 12, r * 0.6);       const fluteAngles = Array.from({ length: flutes }, (_, i) => angle + i * (360 / flutes));       return (         <svg width={W} height={H} style={{ display: "block", margin: "0 auto" }}>           <defs>             <radialGradient id="btg" cx="40%" cy="40%">               <stop offset="0%" stopColor="#ddd" /><stop offset="60%" stopColor="#999" /><stop offset="100%" stopColor="#555" />             </radialGradient>           </defs>           <rect x={20} y={20} width={W-40} height={H-40} fill="#5C3A1E" rx="4" opacity="0.6" />           <rect x={20} y={cy-r-2} width={cx-r} height={r*2+4} fill="#1a0f08" opacity="0.8" />           {fluteAngles.map((fa, i) => {             const faRad = fa * Math.PI / 180;             const chipArcStart = faRad - 0.3;             const chipR = r + chipPx;             const x1 = cx + r * Math.cos(chipArcStart),     y1 = cy + r * Math.sin(chipArcStart);             const x2 = cx + chipR * Math.cos(chipArcStart), y2 = cy + chipR * Math.sin(chipArcStart);             const x3 = cx + chipR * Math.cos(faRad),        y3 = cy + chipR * Math.sin(faRad);             const x4 = cx + r * Math.cos(faRad),            y4 = cy + r * Math.sin(faRad);             return <polygon key={i} points={`${x1},${y1} ${x2},${y2} ${x3},${y3} ${x4},${y4}`} fill="#d4a853" opacity="0.75" />;           })}           <circle cx={cx} cy={cy} r={r} fill="url(#btg)" />           {fluteAngles.map((fa, i) => {             const faRad = fa * Math.PI / 180;             const ex = cx + r * Math.cos(faRad), ey = cy + r * Math.sin(faRad);             const ix = cx + r*0.3*Math.cos(faRad+Math.PI*0.6), iy = cy + r*0.3*Math.sin(faRad+Math.PI*0.6);             return <path key={i} d={`M ${ix},${iy} Q ${cx},${cy} ${ex},${ey}`} stroke="#333" strokeWidth="2.5" fill="none" />;           })}           <circle cx={cx} cy={cy} r={3} fill="#222" />           {(() => {             const fa0 = fluteAngles[0] * Math.PI / 180;             const lx = cx + (r + chipPx/2) * Math.cos(fa0 - 0.15);             const ly = cy + (r + chipPx/2) * Math.sin(fa0 - 0.15);             return <>               <line x1={lx} y1={ly} x2={lx+28} y2={ly-20} stroke="#d4a853" strokeWidth="1" />               <text x={lx+30} y={ly-22} fill="#d4a853" fontSize="9" fontFamily="'Share Tech Mono',monospace">CHIPLOAD</text>               <text x={lx+30} y={ly-12} fill="#d4a853" fontSize="9" fontFamily="'Share Tech Mono',monospace">{chiploadMM.toFixed(3)} mm</text>             </>;           })()}           <line x1={cx-r} y1={cy+r+16} x2={cx+r} y2={cy+r+16} stroke="#60a5fa" strokeWidth={1} />           <line x1={cx-r} y1={cy+r+11} x2={cx-r} y2={cy+r+21} stroke="#60a5fa" strokeWidth={1} />           <line x1={cx+r} y1={cy+r+11} x2={cx+r} y2={cy+r+21} stroke="#60a5fa" strokeWidth={1} />           <text x={cx} y={cy+r+28} textAnchor="middle" fill="#60a5fa" fontSize="9" fontFamily="'Share Tech Mono',monospace">Ø {diaMM} mm</text>           <line x1={cx-r-10} y1={cy} x2={cx-r-35} y2={cy} stroke="#aaa" strokeWidth="1.5" />           <polygon points={`${cx-r-35},${cy-4} ${cx-r-43},${cy} ${cx-r-35},${cy+4}`} fill="#aaa" />           <text x={cx-r-45} y={cy-6} fill="#aaa" fontSize="8" fontFamily="'Share Tech Mono',monospace" textAnchor="end">feed</text>           <text x={cx} y={H-4} textAnchor="middle" fill="#555" fontSize="9" fontFamily="'Share Tech Mono',monospace">TOP-DOWN VIEW — {flutes}-FLUTE BIT ROTATING</text>         </svg>       );     }      /* ── PASS DEPTH DIAGRAM ── */     function PassDepthDiagram({ passDepthMM, toolDiaMM, plungeMM }) {       const W = 320, H = 160, passes = 3;       const woodH = Math.min(passDepthMM * passes * 6 + 20, H - 40);       const passH = Math.min(passDepthMM * 6, (woodH - 20) / passes);       const bitR = Math.min(toolDiaMM / 2 * 6, 20);       return (         <svg width={W} height={H} style={{ display: "block", margin: "0 auto" }}>           <defs>             <linearGradient id="pwg" x1="0" y1="0" x2="0" y2="1">               <stop offset="0%" stopColor="#8B5E3C" /><stop offset="100%" stopColor="#4a2a0e" />             </linearGradient>           </defs>           <rect x={30} y={20} width={180} height={woodH} fill="url(#pwg)" rx="2" />           {[0.2,0.4,0.6,0.8].map(f => <line key={f} x1={30} y1={20+woodH*f} x2={210} y2={20+woodH*f+4} stroke="#6B4423" strokeWidth="0.5" opacity="0.3" />)}           {Array.from({length:passes}).map((_,i) => {             const y = 20 + i * passH;             return <g key={i}>               <rect x={30} y={y} width={180} height={passH} fill={i%2===0?"rgba(0,0,0,0.15)":"rgba(255,255,255,0.05)"} />               {i > 0 && <line x1={30} y1={y} x2={210} y2={y} stroke="#d4a853" strokeWidth="0.8" strokeDasharray="4,3" opacity="0.7" />}               <text x={216} y={y+passH/2+4} fill="#d4a853" fontSize="9" fontFamily="'Share Tech Mono',monospace">pass {i+1}</text>             </g>;           })}           <rect x={30+80-bitR} y={20-30} width={bitR*2} height={35} fill="#bbb" rx="1" />           <rect x={30+80-bitR} y={20} width={bitR*2} height={passH} fill="#999" opacity="0.8" />           <ellipse cx={30+80} cy={20+passH} rx={bitR} ry={3} fill="#777" />           <line x1={15} y1={20} x2={15} y2={20+passH} stroke="#22c55e" strokeWidth={1.5} />           <line x1={10} y1={20} x2={20} y2={20} stroke="#22c55e" strokeWidth={1.5} />           <line x1={10} y1={20+passH} x2={20} y2={20+passH} stroke="#22c55e" strokeWidth={1.5} />           <path d={`M ${30+80-bitR-5},${20} Q ${30+80},${20} ${30+80+bitR},${20+passH*0.4}`} fill="none" stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="3,2" />           <text x={240} y={30} fill="#f59e0b" fontSize="9" fontFamily="'Share Tech Mono',monospace">← ramp in</text>           <text x={240} y={42} fill="#f59e0b" fontSize="8" fontFamily="'Share Tech Mono',monospace">{plungeMM.toFixed(0)} mm/min</text>           <text x={W/2} y={H-4} textAnchor="middle" fill="#555" fontSize="9" fontFamily="'Share Tech Mono',monospace">SIDE VIEW — PASS DEPTH & RAMPING</text>         </svg>       );     }      /* ── MAIN APP ── */     function App() {       const [feedRate, setFeedRate] = useState(2500);       const [rpm, setRpm]           = useState(14000);       const [flutes, setFlutes]     = useState(2);       const [matIdx, setMatIdx]     = useState(0);       const [toolIdx, setToolIdx]   = useState(7); // default 3.175mm       const [vAngle, setVAngle]     = useState(60);       const [channelW, setChannelW] = useState(6);       const [vFlutes, setVFlutes]   = useState(2);       const [activeTab, setActiveTab] = useState("chipload");        const mat      = materials[matIdx];       const diaMM    = toolDiaMM[toolIdx];       const chipload = feedRate / (rpm * flutes);       const minCL    = mat.chipload[toolIdx][0];       const maxCL    = mat.chipload[toolIdx][1];       const inRange  = chipload >= minCL && chipload <= maxCL;       const tooHigh  = chipload > maxCL;       const sc       = inRange ? "#22c55e" : tooHigh ? "#ef4444" : "#f59e0b";       const msg      = inRange ? "✓ IN RANGE" : tooHigh ? "▲ TOO HIGH — lower feed or raise RPM" : "▼ TOO LOW — raise feed or lower RPM";        const isMicro      = TOOLS[toolIdx].group === "micro";       const minPassMM    = isMicro ? diaMM * 0.25 : diaMM;       const maxPassMM    = isMicro ? diaMM * 0.50 : diaMM * 2;       const plungeMM     = feedRate / 2;       const vFeedMM      = vFlutes === 1 ? 1000 : 2000;       const idealFeedMin = rpm * flutes * minCL;       const idealFeedMax = rpm * flutes * maxCL;        return (         <div style={{ background:"#0c0c0c", minHeight:"100vh", color:"#e0d8cc", fontFamily:"'Share Tech Mono',monospace" }}>            {/* Header */}           <div style={{ background:"#111", borderBottom:"1px solid #222", padding:"14px 20px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>             <div>               <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:"24px", letterSpacing:"4px", color:"#d4a853" }}>CNC FEEDS &amp; SPEEDS</div>               <div style={{ fontSize:"9px", color:"#444", letterSpacing:"3px", marginTop:"1px" }}>METRIC CALCULATOR — STOYANOV GUITARS / ONEFINITY WOODWORKER</div>             </div>             <div style={{ fontSize:"9px", color:"#333", letterSpacing:"1px" }}>mm · mm/min · RPM</div>           </div>            <div style={{ padding:"16px", display:"grid", gridTemplateColumns:"320px 1fr", gap:"14px" }}>              {/* LEFT */}             <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>                {/* Material */}               <div className="card">                 <div className="lbl">Material</div>                 <div style={{ display:"flex", flexWrap:"wrap", gap:"5px" }}>                   {materials.map((m,i) => (                     <button key={m.name} className={`mbtn ${matIdx===i?"on":""}`} onClick={() => setMatIdx(i)}                       style={matIdx===i ? {borderColor:m.color,color:m.color,background:`${m.color}12`} : {}}>                       {m.name}                     </button>                   ))}                 </div>               </div>                {/* Tool */}               <div className="card">                 <div className="lbl">Tool Diameter (mm)</div>                 {["micro","small","standard","large"].map(grp => (                   <div key={grp} style={{ marginBottom:"8px" }}>                     <div style={{ fontSize:"8px", letterSpacing:"2px", color:GROUP_COLORS[grp], marginBottom:"4px" }}>                       {GROUP_LABELS[grp]}{grp==="micro" ? " — fragile, max RPM, min chipload" : ""}                     </div>                     <div style={{ display:"flex", flexWrap:"wrap", gap:"4px" }}>                       {TOOLS.map((t,i) => t.group!==grp ? null : (                         <button key={i} className={`mbtn ${toolIdx===i?"on":""}`} onClick={() => setToolIdx(i)}                           style={toolIdx===i ? {borderColor:GROUP_COLORS[grp],color:GROUP_COLORS[grp],background:`${GROUP_COLORS[grp]}12`} : {borderColor:"#2a2a2a"}}>                           {t.label}                         </button>                       ))}                     </div>                   </div>                 ))}                 {isMicro && (                   <div style={{ marginTop:"6px", background:"#1a0000", border:"1px solid #ef444440", borderRadius:"2px", padding:"8px", fontSize:"10px", color:"#ef4444", lineHeight:"1.6" }}>                     ⚠ Micro bit — run at max RPM (30–40k), very low feed (100–300 mm/min), ramp entry only. One wrong move = broken bit.                   </div>                 )}               </div>                {/* Sliders */}               <div className="card">                 <div style={{ marginBottom:"14px" }}>                   <div className="lbl">Feed Rate: <span style={{color:"#d4a853"}}>{feedRate} mm/min</span></div>                   <input type="range" min={50} max={12700} step={50} value={feedRate} onChange={e => setFeedRate(+e.target.value)} />                   <div style={{ display:"flex", justifyContent:"space-between", fontSize:"9px", color:"#444", marginTop:"2px" }}>                     <span>50</span><span style={{color:"#555"}}>practical ~6000</span><span>12 700 (rapid)</span>                   </div>                 </div>                 <div style={{ marginBottom:"14px" }}>                   <div className="lbl">Spindle RPM: <span style={{color:"#d4a853"}}>{rpm.toLocaleString()}</span></div>                   <input type="range" min={1000} max={40000} step={500} value={rpm} onChange={e => setRpm(+e.target.value)} />                   <div style={{ display:"flex", justifyContent:"space-between", fontSize:"9px", color:"#444", marginTop:"2px" }}>                     <span>1 000</span><span>40 000</span>                   </div>                 </div>                 <div>                   <div className="lbl">Flutes: <span style={{color:"#d4a853"}}>{flutes}</span></div>                   <input type="range" min={1} max={4} step={1} value={flutes} onChange={e => setFlutes(+e.target.value)} />                   <div style={{ display:"flex", justifyContent:"space-between", fontSize:"9px", color:"#444", marginTop:"2px" }}>                     <span>1</span><span>4</span>                   </div>                 </div>               </div>                {/* Result */}               <div style={{ background:"#111", border:`2px solid ${sc}`, borderRadius:"3px", padding:"16px", textAlign:"center" }}>                 <div className="lbl">Calculated Chipload</div>                 <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:"52px", color:sc, lineHeight:1 }}>{chipload.toFixed(3)} mm</div>                 <div style={{ fontSize:"10px", color:"#555", margin:"4px 0 6px" }}>Target for {mat.name} Ø{diaMM}mm: {minCL.toFixed(3)} – {maxCL.toFixed(3)} mm</div>                 <div style={{ fontSize:"11px", color:sc, letterSpacing:"1px" }}>{msg}</div>                 <hr className="divider" />                 <div style={{ fontSize:"10px", color:"#666" }}>                   Ideal feed at {rpm.toLocaleString()} RPM: <span style={{color:"#aaa"}}>{idealFeedMin.toFixed(0)}–{idealFeedMax.toFixed(0)} mm/min</span>                 </div>               </div>                {/* Rules */}               <div className="card">                 <div className="lbl" style={{marginBottom:"8px"}}>Rules of Thumb</div>                 <div className="rule">                   <strong style={{color:"#d4a853"}}>PASS DEPTH</strong> = {isMicro ? "0.25×–0.5× Ø (micro!)" : "1× – 2× Ø"}                   <div className="sub">Ø{diaMM}mm → <strong style={{color:isMicro?"#ef4444":"#fff"}}>{minPassMM.toFixed(2)} – {maxPassMM.toFixed(2)} mm</strong> per pass</div>                 </div>                 <div className="rule">                   <strong style={{color:"#d4a853"}}>PLUNGE RATE</strong> = ½ feed rate                   <div className="sub">Feed {feedRate} → plunge <strong style={{color:"#fff"}}>{plungeMM.toFixed(0)} mm/min</strong></div>                 </div>                 <div className="rule">                   <strong style={{color:"#f59e0b"}}>ALWAYS RAMP</strong> — never straight plunge                   <div className="sub">Use helical or ramp entry in Fusion CAM</div>                 </div>                 <div className="rule">                   <strong style={{color:"#d4a853"}}>V-BIT FEED</strong>&nbsp;                   <button className={`mbtn ${vFlutes===1?"on":""}`} style={{fontSize:"9px",padding:"2px 6px"}} onClick={() => setVFlutes(1)}>1 flute</button>&nbsp;                   <button className={`mbtn ${vFlutes===2?"on":""}`} style={{fontSize:"9px",padding:"2px 6px"}} onClick={() => setVFlutes(2)}>2 flute</button>                   <div className="sub">→ <strong style={{color:"#fff"}}>{vFeedMM} mm/min</strong></div>                 </div>               </div>             </div>              {/* RIGHT */}             <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>                {/* Tabs */}               <div style={{ background:"#111", borderBottom:"1px solid #222", display:"flex" }}>                 {[{id:"chipload",label:"CHIPLOAD EXPLAINED"},{id:"vbit",label:"V-BIT DEPTH"},{id:"passdepth",label:"PASS DEPTH"}].map(t => (                   <button key={t.id} className={`tab ${activeTab===t.id?"on":""}`} onClick={() => setActiveTab(t.id)}>{t.label}</button>                 ))}               </div>                {/* Chipload tab */}               {activeTab==="chipload" && (                 <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>                   <div className="card">                     <div className="lbl" style={{marginBottom:"10px"}}>What Is Chipload?</div>                     <p style={{ fontSize:"11px", color:"#888", lineHeight:"1.7", marginBottom:"12px" }}>                       Chipload is the thickness of material each cutting edge removes per revolution — how big a "bite" each flute takes.                       Too small → rubbing, heat, bit burns. Too large → chatter, tearout, broken bit.                     </p>                     <ChiploadDiagram chiploadMM={chipload} diaMM={diaMM} flutes={flutes} />                     <div style={{ marginTop:"8px", background:"#0f0f0f", padding:"10px", borderRadius:"2px", fontSize:"10px", color:"#666", lineHeight:"1.8", textAlign:"center" }}>                       The <span style={{color:"#d4a853"}}>golden wedge</span> ahead of each flute = the chip being cut. That thickness = your chipload.                     </div>                   </div>                   <div className="card">                     <div className="lbl" style={{marginBottom:"8px"}}>The Formulas — Live</div>                     <div className="formula">                       <span className="hi">CHIPLOAD</span> = Feed ÷ (RPM × Flutes)<br/>                       = <span className="val">{feedRate}</span> ÷ ({rpm.toLocaleString()} × {flutes}) = <span style={{color:sc}}>{chipload.toFixed(4)} mm</span>                     </div>                     <div className="formula">                       <span className="hi">IDEAL FEED</span> at {rpm.toLocaleString()} RPM:<br/>                       <span className="val">{idealFeedMin.toFixed(0)} – {idealFeedMax.toFixed(0)} mm/min</span>                     </div>                     <div className="formula">                       <span className="hi">IDEAL RPM</span> at {feedRate} mm/min:<br/>                       <span className="val">{(feedRate/(flutes*maxCL)).toFixed(0)} – {(feedRate/(flutes*minCL)).toFixed(0)} RPM</span>                     </div>                   </div>                 </div>               )}                {/* V-bit tab */}               {activeTab==="vbit" && (                 <div className="card">                   <div className="lbl" style={{marginBottom:"10px"}}>V-Bit Geometry</div>                   <p style={{ fontSize:"11px", color:"#888", lineHeight:"1.7", marginBottom:"12px" }}>                     The V-bit has no fixed depth — <strong style={{color:"#e0d8cc"}}>depth is determined by channel width</strong>.                     A narrow line = shallow cut. A wide area = deep cut. Always set a max depth limit in Fusion.                   </p>                   <div style={{ display:"flex", gap:"16px", marginBottom:"12px", flexWrap:"wrap" }}>                     <div>                       <div className="lbl">V-Bit Angle</div>                       <div style={{ display:"flex", gap:"6px" }}>                         {vAngles.map(a => <button key={a} className={`mbtn ${vAngle===a?"on":""}`} onClick={() => setVAngle(a)}>{a}°</button>)}                       </div>                     </div>                     <div style={{ flex:1, minWidth:"180px" }}>                       <div className="lbl">Channel Width: <span style={{color:"#d4a853"}}>{channelW.toFixed(1)} mm</span></div>                       <input type="range" min={1} max={25} step={0.5} value={channelW} onChange={e => setChannelW(+e.target.value)} />                     </div>                   </div>                   <VBitDiagram angleDeg={vAngle} channelMM={channelW} />                   <div style={{marginTop:"10px"}}>                     <div className="formula">                       <span className="hi">DEPTH</span> = (Width ÷ 2) ÷ tan(angle/2)<br/>                       = ({channelW.toFixed(1)} ÷ 2) ÷ tan({vAngle/2}°) = <span className="val">{((channelW/2)/Math.tan((vAngle/2)*Math.PI/180)).toFixed(2)} mm</span>                     </div>                     <div className="formula" style={{borderColor:"#ef4444"}}>                       <span style={{color:"#ef4444"}}>⚠ FUSION CAM TIP</span><br/>                       Set <span className="hi">Maximum Depth</span> in Engrave/Contour toolpath.<br/>                       Select <span className="hi">top edges</span> of sketch — NOT the bottom face.<br/>                       Use <span className="hi">3D Contour</span> (not Engrave) on curved surfaces.                     </div>                   </div>                 </div>               )}                {/* Pass depth tab */}               {activeTab==="passdepth" && (                 <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>                   <div className="card">                     <div className="lbl" style={{marginBottom:"10px"}}>Pass Depth &amp; Ramping</div>                     <p style={{ fontSize:"11px", color:"#888", lineHeight:"1.7", marginBottom:"12px" }}>                       Never cut full depth in one pass. Each pass removes 1×–2× tool diameter.                       <strong style={{color:"#f59e0b"}}> Always ramp into the material</strong> — straight plunge snaps bits.                     </p>                     <PassDepthDiagram passDepthMM={(minPassMM+maxPassMM)/2} toolDiaMM={diaMM} plungeMM={plungeMM} />                     <div style={{marginTop:"10px"}}>                       <div className="formula">                         <span className="hi">PASS DEPTH</span> for Ø{diaMM}mm in {mat.name}:<br/>                         <span className="val">{minPassMM.toFixed(2)} mm</span> (conservative) — <span className="val">{maxPassMM.toFixed(2)} mm</span> (aggressive)                       </div>                       <div className="formula">                         <span className="hi">PLUNGE RATE</span> = {feedRate} ÷ 2 = <span className="val">{plungeMM.toFixed(0)} mm/min</span>                       </div>                       <div className="formula" style={{borderColor:"#f59e0b"}}>                         <span style={{color:"#f59e0b"}}>RAMPING in Fusion 360:</span><br/>                         CAM → Passes tab → enable <span className="hi">Ramp</span><br/>                         Set ramp angle to 2°–5° for wood                       </div>                     </div>                   </div>                    <div className="card">                     <div className="lbl" style={{marginBottom:"8px"}}>Chipload Reference — {mat.name} (click to select)</div>                     <div style={{ overflowY:"auto", maxHeight:"300px" }}>                       <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"11px" }}>                         <thead>                           <tr style={{ borderBottom:"1px solid #2a2a2a", position:"sticky", top:0, background:"#161616" }}>                             <th style={{ padding:"5px 8px", color:"#555", textAlign:"left", fontWeight:"normal" }}>Ø mm</th>                             <th style={{ padding:"5px 8px", color:"#555", fontWeight:"normal" }}>Group</th>                             <th style={{ padding:"5px 8px", color:"#555`,
